<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brussels Employment Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header>
        <h1>Brussels Employment Dashboard</h1>
        <p>Explore annual average unemployed jobseekers in Brussels.</p>
    </header>

    <main>

    <section id="search-section">
        <h2>Search</h2>

        <input
            type="text"
            id="search-input"
            placeholder="Search by municipality..."
        >
    </section>


    <section id="statistics">

        <h2>Statistics</h2>

        <div class="stats-container">

            <div class="stat-card">
                <h3>Total Records</h3>
                <p id="total-records">--</p>
            </div>

            <div class="stat-card">
                <h3>Highest Municipality</h3>
                <p id="highest-municipality">--</p>
            </div>

            <div class="stat-card">
                <h3>Lowest Municipality</h3>
                <p id="lowest-municipality">--</p>
            </div>

        </div>

    </section>


    <section id="data-table">

        <h2>Employment Data</h2>

        <table>

            <thead>

                <tr>

                    <th>Municipality</th>

                    <th>Year</th>

                    <th>Total</th>

                    <th>Male</th>

                    <th>Female</th>

                    <th>Education</th>

                </tr>

            </thead>

            <tbody id="table-body">

            </tbody>

        </table>

    </section>

</main>
    <script src="js/api.js"></script>
    <script type="module" src="js/app.js"></script>
    

</body>

</html>
