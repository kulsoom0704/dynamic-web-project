<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brussels Employment Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header>
        <h1>Brussels Employment Dashboard</h1>
        <p>Explore annual average unemployed jobseekers in Brussels.</p>
    </header>

    <main>

    <section id="search-section">
        <h2>Search</h2>

        <input
            type="text"
            id="search-input"
            placeholder="Search by municipality..."
        >
    </section>


    <section id="statistics">

        <h2>Statistics</h2>

        <div class="stats-container">

            <div class="stat-card">
                <h3>Total Records</h3>
                <p id="total-records">--</p>
            </div>

            <div class="stat-card">
                <h3>Highest Jobseekers</h3>
                <h2 id="highest-municipality">--</h2>
                <p id="highest-jobseekers">--</p>
            </div>

            <div class="stat-card">
                <h3>Lowest Jobseekers</h3>
                <h2 id="lowest-municipality">--</h2>
                <p id="lowest-jobseekers">--</p>
            </div>

        </div>

    </section>


    <section id="data-table">

        <h2>Employment Data</h2>

        <table>

            <thead>
                <tr>
                    <th>Municipality</th>
                    <th>Year</th>
                    <th>Total Jobseekers</th>
                    <th>Men (%)</th>
                    <th>Women (%)</th>
                    <th>Education Level(%)</th>
                </tr>
            </thead>

            <tbody id="table-body">

            </tbody>

        </table>

    </section>

</main>

    <script type="module" src="js/app.js"></script>
    

</body>

</html>
